{% extends "base.html" %}

{% block title %}Create account{% endblock %}
{% block body_class %}auth-body{% endblock %}

{% block auth_content %}
    <p class="eyebrow">A fresh start</p>
    <h1>Make room for clarity.</h1>
    <p>Create your account to start organizing your finances.</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" maxlength="80"
                   autocomplete="username" placeholder="Choose a username" required>
        </div>
        <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" maxlength="120"
                   autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8"
                   autocomplete="new-password" placeholder="At least 8 characters" required>
        </div>

        <button type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
