{% extends "base.html" %}

{% block title %}Edit budget{% endblock %}
{% block page_title %}Edit budget{% endblock %}
{% block page_description %}
    <p class="page-description">Adjust the amount or period for this spending plan.</p>
{% endblock %}

{% block content %}
    <section class="form-panel">
        <div class="section-heading">
            <div>
                <p class="eyebrow">Budget details</p>
                <h2>Update your plan</h2>
            </div>
        </div>

        <form class="form-grid" method="POST" action="{{ url_for('main.edit_budget', budget_id=budget.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label for="amount">Budget amount (KES)</label>
                <input type="number" id="amount" name="amount" min="0.01" max="9999999999.99"
                       step="0.01" value="{{ form_data.amount }}" required>
            </div>
            <div class="field">
                <label for="category_id">Expense category</label>
                <select id="category_id" name="category_id">
                    <option value="" {% if not form_data.category_id %}selected{% endif %}>Overall budget</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}" {% if form_data.category_id|int == category.id %}selected{% endif %}>
                            {{ category.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="month">Month</label>
                <select id="month" name="month" required>
                    {% for month_number in range(1, 13) %}
                        <option value="{{ month_number }}" {% if form_data.month|int == month_number %}selected{% endif %}>
                            {{ ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][month_number] }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="year">Year</label>
                <input type="number" id="year" name="year" min="2000" max="9998"
                       value="{{ form_data.year }}" required>
            </div>
            <div class="form-actions field-wide">
                <button type="submit">Save changes</button>
                <a class="button button-secondary" href="{{ url_for('main.budgets') }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
