{% extends "base.html" %}

{% block title %}Log in{% endblock %}
{% block body_class %}auth-body{% endblock %}

{% block auth_content %}
    <p class="eyebrow">Welcome back</p>
    <h1>Good to see you.</h1>
    <p>Log in to pick up where you left off.</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" maxlength="120"
                   autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Log in</button>
    </form>

    <p class="auth-switch">Need an account? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    <p class="auth-switch"><a href="{{ url_for('auth.resend_verification') }}">Didn't receive a verification code?</a></p>
{% endblock %}
