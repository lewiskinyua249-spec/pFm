
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction | Personal Finance Manager</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h1>Edit Transaction</h1>

    <nav>
        <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('main.transactions') }}">Transaction History</a>
        <a href="{{ url_for('main.add_transaction') }}">Add Transaction</a>
        <a href="{{ url_for('main.reports') }}">Reports</a>
    </nav>
</header>

<main>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <section>

        <h2>Update Transaction Details</h2>

        <form method="POST"
              action="{{ url_for(
                  'main.edit_transaction',
                  transaction_id=transaction.id
              ) }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="amount">Amount (KES)</label>
            <input
                type="number"
                id="amount"
                name="amount"
                min="0.01"
                max="9999999999.99"
                step="0.01"
                value="{{ transaction.amount }}"
                required
            >

            <label for="type">Transaction Type</label>
            <select id="type" name="type" required>
                <option value="income"
                    {% if transaction.type == "income" %}selected{% endif %}>
                    Income
                </option>

                <option value="expense"
                    {% if transaction.type == "expense" %}selected{% endif %}>
                    Expense
                </option>
            </select>

            <label for="category_id">Category</label>
            <select id="category_id" name="category_id">

                <option value="">No Category</option>

                {% for category in categories %}
                    <option
                        value="{{ category.id }}"
                        data-type="{{ category.type }}"
                        {% if transaction.category_id == category.id %}selected{% endif %}
                    >
                        {{ category.name }}
                    </option>
                {% endfor %}

            </select>

            <label for="description">Description</label>
            <input
                type="text"
                id="description"
                name="description"
                maxlength="255"
                value="{{ transaction.description or '' }}"
            >

            <label for="date">Transaction Date</label>
            <input
                type="date"
                id="date"
                name="date"
                value="{{ transaction.date.isoformat() }}"
                required
            >

            <button type="submit">Save Changes</button>

            <a href="{{ url_for('main.transactions') }}">
                Cancel
            </a>

        </form>

    </section>

</main>

<script src="{{ url_for(
    'static',
    filename='js/transaction.js'
) }}"></script>

</body>
</html>
