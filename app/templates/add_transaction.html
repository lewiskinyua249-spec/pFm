
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction | Personal Finance Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Add Transaction</h1>

        <nav>
            <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
            |
            <a href="{{ url_for('main.categories') }}">Manage Categories</a>
        </nav>
    </header>

    <hr>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <main>

        <form method="POST" action="{{ url_for('main.add_transaction') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="amount">Amount (KES)</label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="0.01"
                    max="9999999999.99"
                    step="0.01"
                    placeholder="Enter amount"
                    required
                >
            </div>

            <br>

            <div>
                <label for="type">Transaction Type</label>

                <select id="type" name="type" required>

                    <option value="">Select type</option>

                    <option value="income">Income</option>

                    <option value="expense">Expense</option>

                </select>
            </div>

            <br>

            <div>
                <label for="category_id">Category</label>

                <select id="category_id" name="category_id">

                    <option value="">No category</option>

                    {% for category in categories %}

                        <option
                            value="{{ category.id }}"
                            data-type="{{ category.type }}"
                        >
                            {{ category.name }} ({{ category.type|capitalize }})
                        </option>

                    {% endfor %}

                </select>
            </div>

            <br>

            <div>
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    maxlength="255"
                    rows="4"
                    placeholder="What was this transaction for?"
                ></textarea>
            </div>

            <br>

            <button type="submit">Save Transaction</button>

        </form>

    </main>

    <hr>

    <footer>
        <a href="{{ url_for('main.dashboard') }}">Back to Dashboard</a>
    </footer>

    <script src="{{ url_for('static', filename='js/transaction.js') }}"></script>
</body>
</html>
